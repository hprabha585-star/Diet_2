# Pings /api/keepalive every 30 minutes so the Aiven free-tier database
# always sees activity and never gets powered off for being idle.
#
# Setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   KEEPALIVE_URL  e.g. https://your-app.vercel.app/api/keepalive
#   CRON_SECRET    the same value as CRON_SECRET in Vercel's env vars
#
# Note: GitHub pauses scheduled workflows in a repo with no commits for
# 60 days, and may run them a few minutes late. cron-job.org (see
# README) is a good second pinger alongside this one.
name: Keep database awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping keep-alive
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then echo "KEEPALIVE_URL secret not set"; exit 1; fi
          code=$(curl -s -o body.txt -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$KEEPALIVE_URL")
          cat body.txt; echo
          echo "HTTP $code"
          # 503 = database was down; the endpoint has already asked Aiven
          # to power it on. Fail the run so it shows up red in Actions.
          [ "$code" = "200" ]
